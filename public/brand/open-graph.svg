<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">แผนที่ประวัติศาสตร์แนวคิดการเรียนรู้โลก</title>
  <desc id="desc">ภาพแชร์สำหรับเว็บไซต์ แสดงตราหลายเส้นทางและชื่อคลังภาษาไทย</desc>
